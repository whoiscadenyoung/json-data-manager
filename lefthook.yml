# Project-local pre-commit gate: lint + auto-format staged files.
# lefthook runs from node_modules (bun devDependency); hooks are installed
# into .git/hooks by the root "prepare" script on bun install.
# scripts/local-gate.sh remains the full gate — this covers commits only.
# Escape hatch: git commit --no-verify.
glob_matcher: doublestar

pre-commit:
  # piped = fail-fast in execution order. lefthook sorts commands by
  # `priority` (alphabetically when unset), so priorities pin lint before
  # fmt: a lint failure blocks the commit and skips formatting entirely.
  piped: true
  commands:
    lint:
      priority: 1
      glob: "**/*.{js,jsx,ts,tsx,mjs,cjs}"
      exclude:
        - "**/_generated/**"
        - "**/routeTree.gen.ts"
        - "packages/ui/src/components/**"
        - "packages/ui/src/niko-table/**"
        - "app/src/lib/supabase/database.types.ts"
      run: bunx oxlint --no-error-on-unmatched-pattern --type-aware --type-check {staged_files}
    fmt:
      priority: 2
      # Formats in place; stage_fixed re-stages the result.
      glob: "**/*.{js,jsx,ts,tsx,mjs,cjs,json,jsonc,md,css}"
      exclude:
        - "**/_generated/**"
        - "**/routeTree.gen.ts"
      run: bunx oxfmt --no-error-on-unmatched-pattern {staged_files}
      stage_fixed: true
