# Root CI gate — docs/data-platform-roadmap.md §3 item 0.5: fmt + lint +
# typecheck + test + build on every PR. The `ci` job carries the PR's single
# green/red signal; `store` is the Supabase side (stage 0 of the migration,
# docs/supabase-migration-design.md §12 + ADR 0015): boot supabase/postgres,
# apply supabase/migrations/*.sql in lexical order, assert PostGIS is live.
#
# Deliberately out of scope here: deploys, publishing, coverage thresholds.
# (The nested packages/data-export workflow inherited from its
# standalone-repo days was removed 2026-09-30 — GitHub never runs workflows
# in subdirectories; data-export's typecheck and test now run here.)
name: CI

on:
  pull_request:
    branches: ["**"]
  push:
    branches: [main]
  workflow_dispatch:

# Superseded PR runs cancel; pushes to main and manual runs never do.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  ci:
    name: Format, lint, typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 30

    # Serves the app's PG integration tests (see the migration-apply step
    # below). Identical config to the store job's service: migrations must
    # re-apply against ONE image, and the docker-hub 15.8.1.049 tag's older
    # storage schema broke 0004 twice (2026-11-03/04).
    services:
      postgres:
        image: public.ecr.aws/supabase/postgres:15.19.0.016
        env:
          POSTGRES_PASSWORD: postgres
          # The image-default database name, deliberately: 0012 creates
          # pg_cron, whose extension may only be created in the database
          # named by cron.database_name (a postmaster-context GUC — GitHub
          # service containers cannot pass postgres server args to change
          # it). The compose self-host keeps `app` and boots the flag
          # instead (docs/self-hosting-design.md §6).
          POSTGRES_DB: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # The app's PG integration tests (*.int.test.ts) connect here (and skip-with-message where the
      # DB is unreachable); same URL shape as the store job's.
      SUPABASE_DB_URL: postgresql://supabase_admin:postgres@localhost:5432/postgres

    steps:
      # Same commit the repo's existing workflow pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Bun setup
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          # Pinned to the dev machine's version (`bun --version`); bump it
          # alongside bun upgrades.
          bun-version: 1.3.5

      - name: Cache bun install
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      # The app's PG integration tests (*.int.test.ts) connect to this job's
      # own postgres service — the store job's env cannot cross jobs, so this
      # job boots an identical service and applies the same migration set
      # before `bun --filter=app run test` (design §12: the int tests read
      # SUPABASE_DB_URL and skip-with-message when unreachable). Without a
      # reachable DB the files still pass as skips; with it, they run for
      # real on every PR. Same script as the store job's apply step below.
      - name: Wait for postgres and apply supabase migrations
        run: |
          set -euo pipefail
          shopt -s nullglob
          export LC_ALL=C
          migrations=(supabase/migrations/*.sql)
          if [ "${#migrations[@]}" -eq 0 ]; then
            echo "::error::No migrations found under supabase/migrations/" >&2
            exit 1
          fi
          for i in $(seq 1 30); do
            psql "$SUPABASE_DB_URL" -X -c 'select 1;' >/dev/null 2>&1 && break
            echo "waiting for postgres (attempt ${i}/30)..."; sleep 2
          done
          psql "$SUPABASE_DB_URL" -X -c 'select 1;' >/dev/null 2>&1 \
            || { echo "::error::postgres never became reachable at \$SUPABASE_DB_URL" >&2; exit 1; }
          for f in "${migrations[@]}"; do
            echo "Applying ${f}"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f "$f"
          done
          echo "Applied ${#migrations[@]} migration(s)."

      # The pg-storage-policies.int.test.ts suite exercises the 0004/0006
      # object policies' BEHAVIOR (owner stamps, dataset-scoped reads), which
      # needs the storage schema to exist — same step-booted container as the
      # store job (identical script; see that job for the full rationale).
      - name: Boot storage-api against the postgres service
        run: |
          set -euo pipefail
          pg_cid="$(docker ps --filter ancestor=public.ecr.aws/supabase/postgres:15.19.0.016 -q | head -1)"
          if [ -z "${pg_cid}" ]; then
            echo "::error::postgres service container not found" >&2
            exit 1
          fi
          net="$(docker inspect "${pg_cid}" --format '{{range $k,$_ := .NetworkSettings.Networks}}{{$k}}{{end}}')"
          docker run -d --name storage-api-verify --network "${net}" \
            -p 5000:5000 \
            -e DATABASE_URL=postgresql://supabase_admin:postgres@postgres:5432/postgres \
            -e ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0 \
            -e SERVICE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU \
            -e AUTH_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long \
            -e STORAGE_BACKEND=file \
            -e FILE_STORAGE_BACKEND_PATH=/tmp/storage-data \
            -e FILE_SIZE_LIMIT=52428800 \
            public.ecr.aws/supabase/storage-api:v1.88.0
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5000/status >/dev/null 2>&1 && break
            echo "waiting for storage-api (attempt ${i}/30)..."; sleep 2
            docker start storage-api-verify >/dev/null 2>&1 || true
          done
          curl -fsS http://localhost:5000/status \
            || { echo "::error::storage-api never became healthy at :5000/status" >&2; docker logs storage-api-verify; exit 1; }

      # app consumes @caden/json-cms, @caden/data-core, @caden/importers and
      # @caden/geometry-archive only through their built dist (each package's
      # exports point at ./dist/...), and every dist is gitignored (root
      # .gitignore: `dist`) — so CI must rebuild them before anything resolves
      # those imports (type-aware lint, app typecheck). data-core and importers
      # build first: json-cms compiles against their dists.
      # data-export's example typecheck does the same through its own exports
      # map, and `bun install` does not run workspace `prepare` scripts, so its
      # dist is rebuilt here too (plain tsc; its _generated dir is committed).
      # No codegen step: app/convex/_generated and the packages' _generated dirs
      # are committed, so typecheck does not depend on regenerating.
      - name: Build workspace dists
        run: |
          bun --filter=@caden/data-core run build
          bun --filter=@caden/importers run build
          bun --filter=@caden/json-cms run build
          bun --filter=@caden/geometry-archive run build
          bun --filter=@caden/data-export run build

      - name: Format check
        run: bun run fmt:check

      - name: Lint
        run: bun run lint

      - name: Typecheck (@caden/data-core)
        run: bun --filter=@caden/data-core run typecheck

      - name: Typecheck (@caden/importers)
        run: bun --filter=@caden/importers run typecheck

      - name: Typecheck (@caden/json-cms)
        run: bun --filter=@caden/json-cms run typecheck

      - name: Typecheck (@caden/geometry-archive)
        run: bun --filter=@caden/geometry-archive run typecheck

      # Source-only package (ADR 0014): no dist, typechecked from src.
      - name: Typecheck (@caden/ui)
        run: bun --filter=@caden/ui run typecheck

      - name: Typecheck (@caden/maps)
        run: bun --filter=@caden/maps run typecheck

      - name: Typecheck (@caden/layer-styles)
        run: bun --filter=@caden/layer-styles run typecheck

      - name: Typecheck (@caden/analysis)
        run: bun --filter=@caden/analysis run typecheck

      - name: Typecheck (@caden/data-export)
        run: bun --filter=@caden/data-export run typecheck

      # app has no typecheck script — bunx tsc --noEmit is the verified command
      # (docs/memory/local-dev-verification.md).
      - name: Typecheck (app)
        run: bunx tsc --noEmit
        working-directory: app

      - name: Test (@caden/data-core)
        run: bun --filter=@caden/data-core run test

      - name: Test (@caden/importers)
        run: bun --filter=@caden/importers run test

      - name: Test (@caden/json-cms)
        run: bun --filter=@caden/json-cms run test

      - name: Test (@caden/geometry-archive)
        run: bun --filter=@caden/geometry-archive run test

      - name: Test (@caden/maps)
        run: bun --filter=@caden/maps run test

      - name: Test (@caden/layer-styles)
        run: bun --filter=@caden/layer-styles run test

      - name: Test (@caden/analysis)
        run: bun --filter=@caden/analysis run test

      - name: Test (app)
        run: bun --filter=app run test

      - name: Test (@caden/data-export)
        run: bun --filter=@caden/data-export run test

      # Build gate (vite build needs no env files — env validation is a
      # runtime, not build-time, concern — verified 2026-09-30 with .env*
      # moved aside).
      - name: Build (app)
        run: bun --filter=app run build

  # Supabase store gate (stage 0 — docs/supabase-migration-design.md §12).
  # Independent of `ci` on purpose: it only needs the checked-out tree plus a
  # Postgres service (plus the storage-api container it boots, so the storage
  # sections of 0004/0006 apply and get asserted), so it stays fast and never
  # holds the main signal's runner hostage. A red here means the migration set
  # no longer applies cleanly, in lexical order, against the pinned
  # supabase/postgres image.
  store:
    name: Supabase store (migrations + PostGIS)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      # Matches the service config below (POSTGRES_PASSWORD/POSTGRES_DB);
      # stage-1 PG integration tests read this same variable
      # (docs/supabase-migration-design.md §12). Connected as supabase_admin,
      # not postgres: in the supabase/postgres image the postgres role is NOT
      # a superuser and schema public is owned by pg_database_owner, so
      # `create table` in public fails for postgres (verified against
      # 15.8.1.049) — the superuser applies migrations of any stage; same
      # POSTGRES_PASSWORD. The database stays the image-default `postgres`:
      # 0012's pg_cron extension can only be created in the database named
      # by cron.database_name (postmaster context — service containers cannot
      # pass server args; see the ci job's POSTGRES_DB comment).
      SUPABASE_DB_URL: postgresql://supabase_admin:postgres@localhost:5432/postgres

    services:
      postgres:
        # supabase/postgres ships PostGIS + the supabase extensions on top of
        # Postgres 15 (docs/supabase-migration-design.md §12). Tag bumped
        # deliberately, never casually — migrations must re-apply against it.
        # Pinned to the SAME image the local stack runs
        # (public.ecr.aws/supabase/postgres:15.19.0.016, §17): the
        # docker-hub 15.8.1.049 tag ships an older storage schema whose
        # storage.buckets lacks `public` and storage.objects lacks `owner_id`,
        # so stage-1's storage migration cannot apply against it (both
        # failures hit on 2026-11-03/04). Aligning CI to the local image
        # kills the drift class; migrations target ONE storage schema.
        image: public.ecr.aws/supabase/postgres:15.19.0.016
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      # Same commit the repo's existing workflow pins.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      # The storage schema's TABLES belong to the storage-api service, not the
      # postgres image (0004's comment): without it, migrations 0004/0006 skip
      # their storage sections loudly and the bucket/object-policy SQL is
      # never CI-verified. Boot the SAME storage-api build the local stack
      # runs (v1.88.0), pointed at this job's postgres service, BEFORE the
      # migrations apply. It cannot be a `services:` entry: GitHub starts
      # services concurrently and storage-api v1.88.0 treats the first
      # refused connection during the postgres image's initdb as fatal
      # (ECONNREFUSED -> startupError, no retry — measured 2026-11-04), so it
      # boots here, after the postgres health gate, attached to the postgres
      # service's network where the service alias is `postgres`. Keys below
      # are the supabase local-dev demo JWTs (public, same values the CLI
      # stack prints; only boot validation reads them).
      - name: Boot storage-api against the postgres service
        run: |
          set -euo pipefail
          pg_cid="$(docker ps --filter ancestor=public.ecr.aws/supabase/postgres:15.19.0.016 -q | head -1)"
          if [ -z "${pg_cid}" ]; then
            echo "::error::postgres service container not found" >&2
            exit 1
          fi
          net="$(docker inspect "${pg_cid}" --format '{{range $k,$_ := .NetworkSettings.Networks}}{{$k}}{{end}}')"
          echo "attaching storage-api to network ${net}"
          docker run -d --name storage-api-verify --network "${net}" \
            -p 5000:5000 \
            -e DATABASE_URL=postgresql://supabase_admin:postgres@postgres:5432/postgres \
            -e ANON_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6ImFub24iLCJleHAiOjE5ODM4MTI5OTZ9.CRXP1A7WOeoJeXxjNni43kdQwgnWNReilDMblYTn_I0 \
            -e SERVICE_KEY=eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZS1kZW1vIiwicm9sZSI6InNlcnZpY2Vfcm9sZSIsImV4cCI6MTk4MzgxMjk5Nn0.EGIM96RAZx35lJzdJsyH-qQwv8Hdp7fsn3W0YpN81IU \
            -e AUTH_JWT_SECRET=super-secret-jwt-token-with-at-least-32-characters-long \
            -e STORAGE_BACKEND=file \
            -e FILE_STORAGE_BACKEND_PATH=/tmp/storage-data \
            -e FILE_SIZE_LIMIT=52428800 \
            public.ecr.aws/supabase/storage-api:v1.88.0
          for i in $(seq 1 30); do
            curl -fsS http://localhost:5000/status >/dev/null 2>&1 && break
            echo "waiting for storage-api (attempt ${i}/30)..."; sleep 2
            docker start storage-api-verify >/dev/null 2>&1 || true
          done
          curl -fsS http://localhost:5000/status \
            || { echo "::error::storage-api never became healthy at :5000/status" >&2; docker logs storage-api-verify; exit 1; }
          echo "storage-api healthy; storage schema present for the migration apply"

      # psql ships preinstalled on the ubuntu-latest runner image (postgresql-client).
      - name: Apply supabase migrations in lexical order
        run: |
          set -euo pipefail
          shopt -s nullglob
          # The service health gate checks the unix socket; TCP can lag and the
          # image restarts postgres once mid-init (both measured against
          # 15.8.1.049). Wait for a real TCP round-trip before applying.
          for i in $(seq 1 30); do
            psql "$SUPABASE_DB_URL" -X -c 'select 1;' >/dev/null 2>&1 && break
            echo "waiting for postgres (attempt ${i}/30)..."; sleep 2
          done
          psql "$SUPABASE_DB_URL" -X -c 'select 1;' >/dev/null 2>&1 \
            || { echo "::error::postgres never became reachable at \$SUPABASE_DB_URL" >&2; exit 1; }
          # LC_ALL=C: byte-order sort, so zero-padded migration names apply in
          # the order their numbers read, whatever the runner's locale is.
          export LC_ALL=C
          migrations=(supabase/migrations/*.sql)
          if [ "${#migrations[@]}" -eq 0 ]; then
            echo "::error::No migrations found under supabase/migrations/ — expected at least 0001_extensions.sql" >&2
            exit 1
          fi
          for f in "${migrations[@]}"; do
            echo "Applying ${f}"
            psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -f "$f"
          done
          echo "Applied ${#migrations[@]} migration(s)."

      # postgis_version() reports e.g. "3.4 USE_GEOS=1 USE_PROJ=1 USE_STATS=1";
      # require it to start with a digit so a connection-level failure or an
      # empty result cannot read as a pass.
      - name: Assert PostGIS is available
        run: |
          set -euo pipefail
          postgis="$(psql "$SUPABASE_DB_URL" -v ON_ERROR_STOP=1 -X -tA -c 'select postgis_version();')"
          echo "postgis_version() -> ${postgis}"
          case "$postgis" in
            [0-9]*)
              echo "PostGIS present: ${postgis%% *}"
              ;;
            *)
              echo "::error::postgis_version() returned '${postgis}' — expected a version string" >&2
              exit 1
              ;;
          esac

      # With the storage-api container booted above, the storage sections of
      # 0004/0006 MUST have applied — a missing bucket or policy here is a
      # real migration defect, not an environment limitation (the bare
      # container skip in those files no longer has a legitimate reason to
      # trigger in this job). Five buckets: 0004's four §6 private buckets +
      # sync-chunks (0012 §3.6). Exactly 8 policies: the 0012 replacement
      # set (it restates the 0006 set with sync-chunks added) —
      # can_view_dataset SELECT + editor+owner INSERT/UPDATE/DELETE on the
      # dataset buckets, and the 4 per-kind marker-sprites policies.
      - name: Assert storage buckets and object policies
        run: |
          set -euo pipefail
          buckets="$(psql "$SUPABASE_DB_URL" -X -tA -c 'select id from storage.buckets order by id;')"
          expected=$'geometries\nmarker-sprites\nsource-files\nsync-chunks\ntile-archives'
          if [ "${buckets}" != "${expected}" ]; then
            echo "::error::storage.buckets rows are '${buckets//$'\n'/,}' — expected the §6 private buckets + sync-chunks (geometries,marker-sprites,source-files,sync-chunks,tile-archives)" >&2
            exit 1
          fi
          n="$(psql "$SUPABASE_DB_URL" -X -tA -c "select count(*) from pg_policies where schemaname = 'storage' and tablename = 'objects';")"
          if [ "${n}" -ne 8 ]; then
            echo "::error::storage.objects carries ${n} policies — expected exactly the 8 the migration set installs (0004/0006)" >&2
            exit 1
          fi
          echo "storage verified: 4 private buckets, 8 object policies"
